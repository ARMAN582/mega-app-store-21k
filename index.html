<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — 500 App Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020408;--surface:#080f1a;--card:#0d1b2e;
  --border:#1a3a5c;--accent:#00f5ff;--accent2:#ff006e;
  --accent3:#7c3aed;--gold:#ffd700;--text:#e2f4ff;--muted:#5a8aaa;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden}

/* GRID BG */
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,245,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.03) 1px,transparent 1px);
  background-size:60px 60px;z-index:0;pointer-events:none;
}

/* HEADER */
header{
  position:sticky;top:0;z-index:1000;
  background:rgba(2,4,8,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 16px;
}
.hdr{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;gap:12px;height:60px;
}
.logo{
  font-family:'Orbitron',monospace;font-size:clamp(16px,3vw,24px);font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;flex-shrink:0;
}
.search-wrap{flex:1;position:relative}
.search-wrap input{
  width:100%;background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:9px 16px 9px 40px;border-radius:25px;
  font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;
  transition:border-color .3s,box-shadow .3s;
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 15px rgba(0,245,255,.25)}
.search-wrap::before{
  content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:14px;pointer-events:none;
}
.hdr-stats{display:flex;gap:16px;flex-shrink:0}
.hdr-stat{text-align:center;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
.hdr-stat b{display:block;color:var(--accent);font-size:13px}
@media(max-width:500px){.hdr-stats{display:none}}

/* FILTERS */
.filters{
  position:sticky;top:60px;z-index:999;
  background:rgba(2,4,8,.92);backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(26,58,92,.4);
  padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.flabel{font-family:'Orbitron',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;flex-shrink:0}
.fbtn{
  padding:5px 14px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;
}
.fbtn:hover,.fbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(0,245,255,.08)}
.fbtn.mob.on{border-color:var(--accent2);color:var(--accent2);background:rgba(255,0,110,.08)}

/* MAIN */
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px 16px 60px}

/* CATEGORY PLACEHOLDER — shown before lazy load */
.cat-block{margin-bottom:50px;contain:layout style}

.cat-head{
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid rgba(26,58,92,.4);
}
.cat-ico{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.cat-info{flex:1;min-width:0}
.cat-num{font-family:'Space Mono',monospace;font-size:9px;color:rgba(0,245,255,.3);letter-spacing:2px}
.cat-name{font-family:'Orbitron',monospace;font-size:clamp(11px,2vw,15px);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-sub{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.cat-badge{
  padding:3px 10px;border-radius:20px;font-size:10px;
  font-weight:700;font-family:'Space Mono',monospace;flex-shrink:0;
}
.bm{background:rgba(255,0,110,.12);border:1px solid var(--accent2);color:var(--accent2)}
.bl{background:rgba(0,245,255,.12);border:1px solid var(--accent);color:var(--accent)}

/* APPS GRID */
.apps-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:10px;
}
@media(max-width:480px){
  .apps-grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px}
}

/* APP CARD */
.app-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 8px 10px;
  text-align:center;cursor:pointer;
  transition:transform .25s,border-color .25s,box-shadow .25s;
  position:relative;overflow:hidden;
  will-change:transform;
}
.app-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(0,245,255,.06));
  opacity:0;transition:opacity .25s;
}
.app-card:hover{
  transform:translateY(-6px) scale(1.04);
  border-color:var(--accent);
  box-shadow:0 12px 30px rgba(0,245,255,.18);
}
.app-card:hover::after{opacity:1}
.app-card:active{transform:scale(.97)}

.a-icon{
  width:50px;height:50px;border-radius:12px;
  margin:0 auto 9px;display:flex;align-items:center;justify-content:center;
  font-size:26px;transition:transform .25s;
}
.app-card:hover .a-icon{transform:scale(1.2) rotate(8deg)}
.a-name{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;transition:color .2s}
.app-card:hover .a-name{color:var(--accent)}
.a-type{font-size:9px;color:var(--muted);margin-top:3px;font-family:'Space Mono',monospace}
.a-stars{font-size:9px;color:var(--gold);margin-top:3px}

/* SKELETON placeholder cards */
.skel{
  background:linear-gradient(90deg,var(--card) 25%,#0f2030 50%,var(--card) 75%);
  background-size:200% 100%;
  animation:shim 1.4s infinite;
  border-radius:14px;height:110px;
}
@keyframes shim{to{background-position:-200% 0}}

/* MODAL */
.overlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.8);backdrop-filter:blur(12px);
  align-items:center;justify-content:center;padding:16px;
}
.overlay.show{display:flex}
.modal{
  width:min(94vw,440px);max-height:88vh;border-radius:26px;
  overflow:hidden;display:flex;flex-direction:column;
  animation:mIn .4s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes mIn{from{opacity:0;transform:scale(.6) translateY(40px)}to{opacity:1;transform:none}}
.m-head{
  padding:36px 24px 24px;text-align:center;position:relative;
  background-size:200% 200%;animation:gradAnim 4s ease infinite;
}
@keyframes gradAnim{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.m-close{
  position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.m-close:hover{background:var(--accent2);transform:rotate(90deg)}
.m-ico{
  width:80px;height:80px;border-radius:20px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:44px;
  background:rgba(0,0,0,.3);backdrop-filter:blur(8px);
  animation:bounce 2.5s ease-in-out infinite;
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.m-name{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:#fff;position:relative}
.m-tag{font-size:12px;color:rgba(255,255,255,.8);margin-top:5px}
.m-body{background:var(--surface);padding:20px;overflow-y:auto;flex:1}
.m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.m-stat{
  background:var(--card);border-radius:12px;padding:12px;text-align:center;
  border:1px solid var(--border);
}
.m-stat-n{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:var(--accent)}
.m-stat-l{font-size:10px;color:var(--muted);margin-top:3px}
.m-feats h4{font-family:'Orbitron',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:10px}
.m-feat{
  display:flex;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid rgba(26,58,92,.3);
  font-size:13px;
}
.m-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;animation:dp 1.5s ease infinite}
@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.6);opacity:.6}}
.m-btns{display:flex;gap:10px;margin-top:18px}
.m-btn{
  flex:1;padding:13px;border-radius:12px;border:none;
  font-family:'Orbitron',monospace;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .25s;letter-spacing:.5px;
}
.m-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,245,255,.3)}
.btn-p{background:linear-gradient(135deg,var(--accent),#0af);color:#000}
.btn-s{background:transparent;border:1px solid var(--accent)!important;color:var(--accent)}

/* SCROLL TOP */
#stBtn{
  position:fixed;bottom:24px;right:20px;z-index:500;
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  border:none;cursor:pointer;font-size:20px;color:#000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(16px);transition:all .3s;
  box-shadow:0 4px 16px rgba(0,245,255,.35);
}
#stBtn.show{opacity:1;transform:translateY(0)}
#stBtn:hover{transform:translateY(-3px) scale(1.1)}

/* NO RESULT */
.no-res{text-align:center;padding:80px 20px;color:var(--muted);font-family:'Orbitron',monospace;font-size:14px}

/* COUNT BAR */
.count-bar{
  padding:8px 0 14px;font-family:'Space Mono',monospace;
  font-size:11px;color:var(--muted);
}
.count-bar span{color:var(--accent)}
</style>
</head>

</div>

<button id="stBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

// ── GENERATORS ─────────────────────────────────────────
const PFX=['Nova','Apex','Zen','Flux','Neon','Spark','Echo','Pulse','Volt','Grid','Arc','Shift','Hyper','Ultra','Mega','Proto','Alpha','Beta','Sigma','Prime','Core','Edge','Peak','Zeta','Vibe','Flow','Glow','Sync','Link','Hub','Byte','Pixel','Wave','Beam','Boost','Dash','Flash','Rush','Surge','Storm','Blaze','Swift','Snap','Bold','Fuse'];
const SFX=['Pro','X','AI','Go','App','Hub','Plus','Max','One','Now','Live','Fast','Smart','Lite','Neo','OS','Kit','Lab','Pad','Deck','Box','Flex','Zen','Flow','Sync','Link','Base','Cloud','Net','Desk'];
const ICONS=['🚀','⚡','🌟','💎','🔮','🎯','🌊','🔥','❄️','🌈','💡','🎨','🎮','🎵','🎬','📊','🔐','🌐','💰','🏆','🤖','✨','🦋','🐉','🎭','🎪','🔬','🧬','⚛️','🌙','☀️','🌴','🏔️','🦁','🐋','🦅','🌺','🍀','⚓','🎸','🎹','🥁','🎺','🎻','🏹','🗡️','🛡️','⚔️','🧿','🔱','⚜️','🌀','💠','🔷','🔶'];
const TYPES=['Free','Premium','Freemium','Open Source','Enterprise','Beta'];
const TAGLINES=['The future is here','Smarter & faster','Built for you','Where innovation lives','Power meets simplicity','Your universe, simplified','Unlock your potential','Beyond boundaries','The ultimate tool','Next-gen experience'];
const FEATS=['AI-powered recommendations','Real-time sync across devices','End-to-end encryption','Offline mode','Advanced analytics','One-tap cloud backup','Multi-user collaboration','Dark mode support','Voice command ready','Biometric auth','Automated workflows','Third-party integrations','Smart notifications','Widget support','Export to any format','Priority 24/7 support','Gesture navigation','AR-enhanced UI','ML personalization','Battery optimized'];

let seed=42;
function rng(){seed=(seed*1664525+1013904223)&0xffffffff;return(seed>>>0)/4294967296}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}
function appName(){return Math.random()>.5?pick(PFX)+' '+pick(SFX):pick(PFX)+pick(SFX);}
function stars(){const r=(3.5+rng()*1.4).toFixed(1);return'★'+r;}
function grad(c){const h=Math.floor(rng()*360);return`linear-gradient(135deg,${c},hsl(${h},65%,30%))`;}

// ── STATE ──────────────────────────────────────────────
let filter='all', searchQ='', visibleCats=[], loadedCount=0;
const BATCH=8; // load 8 categories at a time

// ── FILTER & SEARCH ───────────────────────────────────
function getVisible(){
  const q=searchQ.toLowerCase();
  return CATS.filter((c,i)=>{
    if(filter!=='all'&&c.t!==filter)return false;
    if(q&&!c.n.toLowerCase().includes(q))return false;
    return true;
  });
}

// ── RENDER ONE CATEGORY ───────────────────────────────
function renderCat(cat,idx,globalIdx){
  seed=globalIdx*31+7; // deterministic per category
  const block=document.createElement('div');
  block.className='cat-block';
  block.dataset.type=cat.t;

  const isMob=cat.t==='mobile';
  const badgeCls=isMob?'bm':'bl';
  const badgeTxt=isMob?'📱 MOBILE':'💻 LAPTOP';
  const g=grad(cat.c);

  block.innerHTML=`
    <div class="cat-head">
      <div class="cat-ico" style="background:${g}">${cat.i}</div>
      <div class="cat-info">
        <div class="cat-num">CAT — ${String(globalIdx+1).padStart(3,'0')}</div>
        <div class="cat-name" style="color:${cat.c}">${cat.n}</div>
        <div class="cat-sub">42 apps · ${cat.t.toUpperCase()}</div>
      </div>
      <span class="cat-badge ${badgeCls}">${badgeTxt}</span>
    </div>
    <div class="apps-grid" id="ag${globalIdx}"></div>`;

  // Build 42 app cards efficiently
  const grid=block.querySelector(`#ag${globalIdx}`);
  const frag=document.createDocumentFragment();
  for(let i=0;i<42;i++){
    seed=globalIdx*1000+i*17+3;
    const name=appName();
    const icon=pick(ICONS);
    const type=pick(TYPES);
    const st=stars();
    const igrad=grad(cat.c);

    const card=document.createElement('div');
    card.className='app-card';
    card.innerHTML=`<div class="a-icon" style="background:${igrad}">${icon}</div>
      <div class="a-name">${name}</div>
      <div class="a-type">${type}</div>
      <div class="a-stars">${st}</div>`;

    card.addEventListener('click',()=>openModal(name,icon,cat,igrad),{passive:true});
    frag.appendChild(card);
  }
  grid.appendChild(frag);
  return block;
}

// ── VIRTUAL / LAZY RENDER ─────────────────────────────
let renderTimer=null;
function buildList(){
  const root=document.getElementById('root');
  root.innerHTML='';
  loadedCount=0;
  visibleCats=getVisible();
  document.getElementById('countSpan').textContent=visibleCats.length;

  if(!visibleCats.length){
    root.innerHTML='<div class="no-res">No results found 🔍</div>';
    return;
  }
  loadMore();
}

function loadMore(){
  const root=document.getElementById('root');
  const end=Math.min(loadedCount+BATCH,visibleCats.length);
  const frag=document.createDocumentFragment();
  for(let i=loadedCount;i<end;i++){
    const origIdx=CATS.indexOf(visibleCats[i]);
    frag.appendChild(renderCat(visibleCats[i],i,origIdx));
  }
  root.appendChild(frag);
  loadedCount=end;
}

// IntersectionObserver sentinel for infinite scroll
let sentinel=null;
function setupSentinel(){
  if(sentinel){sentinel.remove();sentinel=null;}
  sentinel=document.createElement('div');
  sentinel.style.height='20px';
  document.getElementById('root').appendChild(sentinel);

  const obs=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting&&loadedCount<visibleCats.length){
      // Load next batch when near bottom
      requestAnimationFrame(()=>{
        loadMore();
        if(loadedCount>=visibleCats.length){obs.disconnect();}
      });
    }
  },{rootMargin:'300px'});
  obs.observe(sentinel);
}

// ── SEARCH ────────────────────────────────────────────
let searchTimer=null;
document.getElementById('searchIn').addEventListener('input',function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    searchQ=this.value.trim();
    buildList();
    setupSentinel();
  },250);
});

// ── FILTERS ──────────────────────────────────────────
document.querySelectorAll('.fbtn').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
    this.classList.add('on');
    filter=this.dataset.f;
    buildList();
    setupSentinel();
  });
});

// ── MODAL ─────────────────────────────────────────────
function openModal(name,icon,cat,igrad){
  const ov=document.getElementById('overlay');
  const head=document.getElementById('mHead');
  head.style.background=igrad;
  head.style.backgroundSize='200% 200%';
  document.getElementById('mIco').textContent=icon;
  document.getElementById('mName').textContent=name;
  document.getElementById('mTag').textContent=pick(TAGLINES);

  const sData=[
    {n:(Math.random()*50+1).toFixed(1)+'M',l:'Downloads'},
    {n:(3.5+Math.random()*1.4).toFixed(1)+'★',l:'Rating'},
    {n:(Math.random()*200+10).toFixed(0)+'MB',l:'Size'}
  ];
  document.getElementById('mStats').innerHTML=sData.map(s=>
    `<div class="m-stat"><div class="m-stat-n">${s.n}</div><div class="m-stat-l">${s.l}</div></div>`
  ).join('');

  const feats=[...FEATS].sort(()=>Math.random()-.5).slice(0,5);
  document.getElementById('mFeats').innerHTML=feats.map((f,i)=>
    `<div class="m-feat" style="animation-delay:${i*.08}s">
      <div class="m-dot" style="background:${cat.c}"></div>
      <span>${f}</span>
    </div>`
  ).join('');

  ov.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── SCROLL TOP ────────────────────────────────────────
window.addEventListener('scroll',()=>{
  document.getElementById('stBtn').classList.toggle('show',window.scrollY>400);
},{passive:true});

// ── INIT ─────────────────────────────────────────────
buildList();
setupSentinel();
</script>
