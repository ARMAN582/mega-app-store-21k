<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — 500 Category App Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020408;
    --surface: #080f1a;
    --card: #0d1b2e;
    --border: #1a3a5c;
    --accent: #00f5ff;
    --accent2: #ff006e;
    --accent3: #7c3aed;
    --gold: #ffd700;
    --text: #e2f4ff;
    --muted: #5a8aaa;
    --glow: 0 0 20px rgba(0,245,255,0.4);
    --glow2: 0 0 20px rgba(255,0,110,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  .cursor {
    position: fixed; width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 99999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent);
  }
  .cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border: 2px solid var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 99998;
    transform: translate(-50%,-50%);
    transition: transform 0.15s ease, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.6;
  }

  /* BACKGROUND PARTICLES */
  #particles {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 0;
    pointer-events: none;
  }

  /* GRID OVERLAY */
  body::before {
    content: '';
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0; pointer-events: none;
    animation: gridPulse 4s ease-in-out infinite;
  }
  @keyframes gridPulse {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(2,4,8,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }
  .header-inner {
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: center;
    gap: 20px; height: 70px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px,3vw,28px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: logoGlow 3s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes logoGlow {
    0%,100% { filter: drop-shadow(0 0 8px rgba(0,245,255,0.8)); }
    50% { filter: drop-shadow(0 0 20px rgba(255,0,110,0.8)); }
  }
  .search-bar {
    flex: 1; min-width: 200px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px 10px 45px;
    border-radius: 30px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .search-bar::before {
    content: '⌖'; position: absolute;
    left: 15px; top: 50%; transform: translateY(-50%);
    color: var(--accent); font-size: 20px; z-index: 1;
  }
  .header-stats {
    display: flex; gap: 15px; font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--muted);
  }
  .stat { text-align: center; }
  .stat-num { color: var(--accent); font-size: 14px; font-weight: 700; }

  /* FILTER TABS */
  .filter-bar {
    position: sticky; top: 70px; z-index: 999;
    background: rgba(2,4,8,0.9);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(26,58,92,0.5);
    padding: 12px 20px;
    display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center;
  }
  .filter-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px; color: var(--muted);
    letter-spacing: 2px;
  }
  .filter-btn {
    padding: 6px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 1px;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,245,255,0.08);
    box-shadow: var(--glow);
  }
  .filter-btn.mobile.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255,0,110,0.08);
    box-shadow: var(--glow2);
  }

  /* MAIN LAYOUT */
  main {
    position: relative; z-index: 1;
    max-width: 1600px; margin: 0 auto;
    padding: 30px 20px;
  }

  /* CATEGORY SECTION */
  .category-section {
    margin-bottom: 60px;
    animation: fadeInUp 0.6s ease both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .category-header {
    display: flex; align-items: center;
    gap: 15px; margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(26,58,92,0.5);
    position: relative;
  }
  .category-header::after {
    content: ''; position: absolute; bottom: -1px; left: 0;
    width: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    transition: width 1s ease;
  }
  .category-section:hover .category-header::after { width: 100%; }

  .cat-icon {
    width: 50px; height: 50px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    position: relative;
    animation: iconFloat 3s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(5deg); }
  }
  .cat-info { flex: 1; }
  .cat-name {
    font-family: 'Orbitron', monospace;
    font-size: clamp(13px,2vw,18px);
    font-weight: 700;
    margin-bottom: 3px;
  }
  .cat-meta {
    font-size: 12px; color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .cat-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px; font-weight: 700;
    font-family: 'Space Mono', monospace;
    letter-spacing: 1px;
  }
  .badge-mobile {
    background: rgba(255,0,110,0.15);
    border: 1px solid var(--accent2);
    color: var(--accent2);
  }
  .badge-laptop {
    background: rgba(0,245,255,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .badge-both {
    background: rgba(124,58,237,0.15);
    border: 1px solid var(--accent3);
    color: var(--accent3);
  }

  /* APPS GRID */
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }

  /* APP CARD */
  .app-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
    position: relative;
    overflow: hidden;
    animation: cardPop 0.4s ease both;
  }
  .app-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(0,245,255,0.05));
    opacity: 0; transition: opacity 0.3s;
  }
  .app-card::after {
    content: ''; position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(transparent, rgba(0,245,255,0.1), transparent);
    opacity: 0; transition: opacity 0.3s;
    animation: rotate 3s linear infinite;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes cardPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .app-card:hover {
    transform: translateY(-8px) scale(1.05);
    border-color: var(--accent);
    box-shadow: 0 15px 40px rgba(0,245,255,0.2), var(--glow);
    z-index: 10;
  }
  .app-card:hover::before { opacity: 1; }
  .app-card:hover::after { opacity: 1; }

  .app-icon-wrap {
    width: 56px; height: 56px;
    margin: 0 auto 10px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    position: relative; z-index: 1;
    transition: transform 0.3s;
  }
  .app-card:hover .app-icon-wrap {
    transform: scale(1.15) rotate(10deg);
    animation: iconSpin 0.5s ease;
  }
  @keyframes iconSpin {
    from { transform: scale(1.15) rotate(0deg); }
    to { transform: scale(1.15) rotate(360deg); }
  }
  .app-name {
    font-size: 11px; font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    position: relative; z-index: 1;
    transition: color 0.3s;
  }
  .app-card:hover .app-name { color: var(--accent); }
  .app-type {
    font-size: 9px; color: var(--muted);
    margin-top: 4px; position: relative; z-index: 1;
    font-family: 'Space Mono', monospace;
  }
  .app-stars {
    font-size: 9px; color: var(--gold);
    margin-top: 4px; position: relative; z-index: 1;
  }

  /* APP HOME MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    animation: overlayIn 0.3s ease;
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-overlay.show { display: flex; align-items: center; justify-content: center; }

  .app-home {
    width: min(95vw, 480px);
    max-height: 90vh;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    animation: modalIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
    display: flex; flex-direction: column;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.5) rotateY(30deg); }
    to { opacity: 1; transform: scale(1) rotateY(0deg); }
  }

  .app-home-header {
    padding: 40px 30px 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .app-home-header::before {
    content: ''; position: absolute; inset: 0;
    animation: gradShift 3s ease infinite;
  }
  @keyframes gradShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .home-app-icon {
    width: 90px; height: 90px;
    border-radius: 22px;
    margin: 0 auto 15px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    position: relative;
    animation: iconBounce 2s ease-in-out infinite;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  @keyframes iconBounce {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-10px) scale(1.05); }
  }
  .home-app-name {
    font-family: 'Orbitron', monospace;
    font-size: 22px; font-weight: 900;
    color: #fff;
    position: relative; z-index: 1;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .home-app-tagline {
    font-size: 13px; opacity: 0.85; margin-top: 5px;
    position: relative; z-index: 1; color: #fff;
  }

  .app-home-body {
    background: var(--surface);
    padding: 25px;
    overflow-y: auto;
    flex: 1;
  }
  .home-stats {
    display: grid; grid-template-columns: repeat(3,1fr);
    gap: 12px; margin-bottom: 25px;
  }
  .home-stat {
    background: var(--card);
    border-radius: 14px; padding: 14px;
    text-align: center;
    border: 1px solid var(--border);
    animation: statPulse 2s ease infinite;
  }
  .home-stat:nth-child(2) { animation-delay: 0.3s; }
  .home-stat:nth-child(3) { animation-delay: 0.6s; }
  @keyframes statPulse {
    0%,100% { border-color: var(--border); }
    50% { border-color: rgba(0,245,255,0.3); }
  }
  .home-stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 18px; font-weight: 700;
    color: var(--accent);
  }
  .home-stat-label { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .home-features { margin-bottom: 20px; }
  .home-features h4 {
    font-family: 'Orbitron', monospace;
    font-size: 12px; color: var(--muted);
    letter-spacing: 2px; margin-bottom: 12px;
  }
  .feature-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(26,58,92,0.3);
    animation: featureSlide 0.4s ease both;
  }
  @keyframes featureSlide {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .feature-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: dotPulse 1.5s ease infinite;
    flex-shrink: 0;
  }
  @keyframes dotPulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.6; }
  }
  .feature-text { font-size: 13px; color: var(--text); }

  .home-cta {
    display: flex; gap: 12px;
  }
  .btn-install {
    flex: 1; padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    position: relative; overflow: hidden;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .btn-install::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .btn-install:hover::before { transform: translateX(100%); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #0099cc);
    color: #000;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--accent) !important;
    color: var(--accent);
  }
  .btn-install:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,245,255,0.3); }

  .close-modal {
    position: absolute; top: 15px; right: 15px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    transition: all 0.2s;
  }
  .close-modal:hover {
    background: var(--accent2);
    transform: rotate(90deg) scale(1.1);
  }

  /* LOADING */
  .loading-screen {
    position: fixed; inset: 0; z-index: 99999;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    transition: opacity 0.5s, visibility 0.5s;
  }
  .loading-screen.hide { opacity: 0; visibility: hidden; }
  .load-logo {
    font-family: 'Orbitron', monospace;
    font-size: 40px; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: loadPulse 1s ease infinite;
  }
  @keyframes loadPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .load-bar-wrap {
    width: 300px; height: 4px;
    background: var(--card); border-radius: 4px; overflow: hidden;
  }
  .load-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0; border-radius: 4px;
    animation: loadFill 1.5s ease forwards;
  }
  @keyframes loadFill { to { width: 100%; } }
  .load-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px; color: var(--muted);
    animation: loadText 1.5s steps(20) forwards;
  }

  /* SCROLL TO TOP */
  .scroll-top {
    position: fixed; bottom: 30px; right: 30px;
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    border: none; cursor: pointer; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #000;
    opacity: 0; transform: translateY(20px);
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0,245,255,0.4);
  }
  .scroll-top.show { opacity: 1; transform: translateY(0); }
  .scroll-top:hover { transform: translateY(-4px) scale(1.1); }
  .scroll-top:hover { animation: btnSpin 0.5s ease; }
  @keyframes btnSpin { to { transform: translateY(-4px) scale(1.1) rotate(360deg); } }

  /* FLOATING PARTICLES CANVAS */
  #particles { opacity: 0.6; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .apps-grid { grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap: 8px; }
    .header-stats { display: none; }
    .app-card { padding: 12px 6px; }
    .app-icon-wrap { width: 44px; height: 44px; font-size: 22px; }
    .cat-icon { width: 40px; height: 40px; font-size: 20px; }
    .filter-bar { padding: 8px 15px; }
  }

  /* SECTION COUNT */
  .section-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: rgba(0,245,255,0.3);
    letter-spacing: 2px; margin-bottom: 5px;
  }

  /* PULSE RING */
  .pulse-ring {
    position: absolute; inset: -4px;
    border-radius: 18px;
    border: 2px solid var(--accent);
    opacity: 0;
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.4); }
  }

  /* SKELETON LOADER */
  .skeleton {
    background: linear-gradient(90deg, var(--card) 25%, var(--surface) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="load-logo">NEXUS</div>
  <div class="load-bar-wrap"><div class="load-bar"></div></div>
  <div class="load-text">Initializing 500 Universe Portals...</div>
</div>

<!-- Cursor -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Particles Canvas -->
<canvas id="particles"></canvas>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="app-home" id="appHome">
    <div class="app-home-header" id="appHomeHeader">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <div class="home-app-icon" id="homeIcon"></div>
      <div class="home-app-name" id="homeName"></div>
      <div class="home-app-tagline" id="homeTagline"></div>
    </div>
    <div class="app-home-body">
      <div class="home-stats" id="homeStats"></div>
      <div class="home-features">
        <h4>KEY FEATURES</h4>
        <div id="homeFeatures"></div>
      </div>
      <div class="home-cta">
        <button class="btn-install btn-primary">⚡ INSTALL NOW</button>
        <button class="btn-install btn-secondary">♡ WISHLIST</button>
      </div>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-inner">
    <div class="logo">◈ NEXUS</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search apps, categories..." oninput="filterApps(this.value)">
    </div>
    <div class="header-stats">
      <div class="stat"><div class="stat-num">500</div><div>Categories</div></div>
      <div class="stat"><div class="stat-num">21K</div><div>Apps</div></div>
      <div class="stat"><div class="stat-num">∞</div><div>Vibes</div></div>
    </div>
  </div>
</header>

<!-- Filter Bar -->
<div class="filter-bar">
  <span class="filter-label">FILTER:</span>
  <button class="filter-btn active" onclick="setFilter('all',this)">ALL</button>
  <button class="filter-btn mobile" onclick="setFilter('mobile',this)">📱 MOBILE</button>
  <button class="filter-btn" onclick="setFilter('laptop',this)">💻 LAPTOP</button>
  <button class="filter-btn" onclick="setFilter('both',this)">⚡ BOTH</button>
</div>

<!-- Main -->
<main id="mainContent"></main>

<!-- Scroll Top -->
<button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

const APP_PREFIXES = ['Nova','Apex','Zen','Flux','Neon','Spark','Echo','Pulse','Volt','Grid','Arc','Shift','Hyper','Ultra','Mega','Super','Proto','Alpha','Beta','Gamma','Delta','Sigma','Prime','Core','Edge','Peak','Zeta','Vibe','Flow','Glow','Sync','Link','Hub','Node','Byte','Pixel','Wave','Beam','Boost','Dash','Flash','Rush','Surge','Storm','Blaze'];
const APP_SUFFIXES = ['Pro','X','AI','Go','App','Hub','Plus','Max','One','Now','Live','Fast','Smart','Lite','Neo','OS','Ui','Kit','Lab','Pad','Deck','Box','Flex','Zen','Flow','Sync','Link','Base','Cloud','Net'];
const APP_ICONS_LIST = ['🚀','⚡','🌟','💎','🔮','🎯','🌊','🔥','❄️','🌈','💡','🎨','🎮','🎵','🎬','📊','🔐','🌐','💰','🏆','🤖','✨','🦋','🐉','🎭','🎪','🔬','🧬','⚛️','🌙','☀️','🌴','🏔️','🦁','🐋','🦅','🌺','🍀','⚓','🎸','🎹','🥁','🎺','🎻','🪗','🎷','🏹','🗡️','🛡️','⚔️','🧿','🔱','☯️','⚜️','🌀','💠','🔷','🔶','🔴','🟢','🟣','🟡'];

function genAppName() {
  const p = APP_PREFIXES[Math.floor(Math.random()*APP_PREFIXES.length)];
  const s = APP_SUFFIXES[Math.floor(Math.random()*APP_SUFFIXES.length)];
  return Math.random()>0.5 ? p+' '+s : p+s;
}
function genIcon() {
  return APP_ICONS_LIST[Math.floor(Math.random()*APP_ICONS_LIST.length)];
}
function genStars() {
  const r = (3.5 + Math.random()*1.5).toFixed(1);
  return '★'.repeat(Math.floor(r)) + (r%1?'½':'') + ' '+r;
}
function genType() {
  return APP_TYPES[Math.floor(Math.random()*APP_TYPES.length)];
}
function genGradient(color) {
  const h2 = Math.floor(Math.random()*360);
  return `linear-gradient(135deg, ${color}, hsl(${h2},70%,35%))`;
}
function genTagline(appName) {
  const taglines = [
    `The future of ${appName} is here`,
    `Smarter, faster, better`,
    `Redefining the experience`,
    `Built for the next generation`,
    `Where innovation meets design`,
    `Power meets simplicity`,
    `Your universe, simplified`,
    `Unlock your potential`,
    `Beyond boundaries`,
    `The ultimate solution`
  ];
  return taglines[Math.floor(Math.random()*taglines.length)];
}
function genFeatures() {
  const features = [
    'AI-powered smart recommendations',
    'Real-time sync across all devices',
    'End-to-end encrypted data',
    'Offline mode with smart caching',
    'Advanced analytics dashboard',
    'One-tap cloud backup',
    'Collaborative multi-user workspace',
    'Custom themes and dark mode',
    'Voice command integration',
    'Biometric authentication support',
    'Automated workflow builder',
    'Third-party app integrations',
    'Smart notification manager',
    'Battery optimization mode',
    'Export to multiple formats',
    'Priority customer support 24/7',
    'Widget and shortcut support',
    'Gesture-based navigation',
    'AR-enhanced interface',
    'Machine learning personalization'
  ];
  const count = 4 + Math.floor(Math.random()*3);
  return [...features].sort(()=>Math.random()-0.5).slice(0,count);
}
function genStats() {
  return [
    {num: (Math.random()*50+1).toFixed(1)+'M', label:'Downloads'},
    {num: (3.5+Math.random()*1.4).toFixed(1)+'★', label:'Rating'},
    {num: (Math.random()*200+10).toFixed(0)+'MB', label:'Size'}
  ];
}

// ===== RENDER ENGINE =====
let activeFilter = 'all';
let allSections = [];

function buildAppsGrid(catIndex, cat) {
  const apps = [];
  for(let i=0; i<42; i++) {
    const name = genAppName();
    const icon = genIcon();
    const stars = genStars();
    const type = genType();
    apps.push({name,icon,stars,type,catIndex,appIndex:i,cat});
  }
  return apps;
}

function renderCategories(filter='all') {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  const frag = document.createDocumentFragment();

  const filtered = CATEGORIES.filter(c => filter==='all' || c.type===filter);

  filtered.forEach((cat, i) => {
    const sec = document.createElement('div');
    sec.className = 'category-section';
    sec.style.animationDelay = `${(i%20)*0.03}s`;
    sec.dataset.catType = cat.type;

    const badgeClass = cat.type==='mobile'?'badge-mobile':cat.type==='laptop'?'badge-laptop':'badge-both';
    const badgeText = cat.type==='mobile'?'📱 MOBILE':cat.type==='laptop'?'💻 LAPTOP':'⚡ BOTH';

    sec.innerHTML = `
      <div class="category-header">
        <div class="cat-icon" style="background:${genGradient(cat.color)}">
          <div class="pulse-ring"></div>
          ${cat.icon}
        </div>
        <div class="cat-info">
          <div class="section-num">CAT — ${String(i+1).padStart(3,'0')}</div>
          <div class="cat-name" style="color:${cat.color}">${cat.name}</div>
          <div class="cat-meta">42 apps • ${cat.type.toUpperCase()} CATEGORY</div>
        </div>
        <span class="cat-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="apps-grid" id="grid-${i}"></div>
    `;
    frag.appendChild(sec);

    // Build apps
    const apps = buildAppsGrid(i, cat);
    setTimeout(() => {
      const grid = document.getElementById(`grid-${i}`);
      if(!grid) return;
      apps.forEach((app, ai) => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.style.animationDelay = `${ai*0.02}s`;
        card.style.setProperty('--card-color', cat.color);
        card.innerHTML = `
          <div class="app-icon-wrap" style="background:${genGradient(cat.color)}">${app.icon}</div>
          <div class="app-name">${app.name}</div>
          <div class="app-type">${app.type}</div>
          <div class="app-stars">${app.stars}</div>
        `;
        card.addEventListener('click', () => openModal(app, cat));
        grid.appendChild(card);
      });
    }, i * 5);
  });

  main.appendChild(frag);
}

function openModal(app, cat) {
  const overlay = document.getElementById('modalOverlay');
  const header = document.getElementById('appHomeHeader');
  const icon = document.getElementById('homeIcon');
  const name = document.getElementById('homeName');
  const tagline = document.getElementById('homeTagline');
  const stats = document.getElementById('homeStats');
  const features = document.getElementById('homeFeatures');

  const grad = genGradient(cat.color);
  header.style.background = grad;
  header.style.backgroundSize = '200% 200%';
  icon.style.background = 'rgba(0,0,0,0.3)';
  icon.style.backdropFilter = 'blur(10px)';
  icon.innerHTML = app.icon;
  name.textContent = app.name;
  tagline.textContent = genTagline(app.name);

  const statData = genStats();
  stats.innerHTML = statData.map(s=>`
    <div class="home-stat">
      <div class="home-stat-num">${s.num}</div>
      <div class="home-stat-label">${s.label}</div>
    </div>
  `).join('');

  const feats = genFeatures();
  features.innerHTML = feats.map((f,i)=>`
    <div class="feature-item" style="animation-delay:${i*0.1}s">
      <div class="feature-dot" style="background:${cat.color}"></div>
      <div class="feature-text">${f}</div>
    </div>
  `).join('');

  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCategories(filter);
}

function filterApps(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.category-section').forEach(sec => {
    const name = sec.querySelector('.cat-name')?.textContent.toLowerCase()||'';
    const cards = sec.querySelectorAll('.app-card');
    let visible = 0;
    cards.forEach(card => {
      const appName = card.querySelector('.app-name')?.textContent.toLowerCase()||'';
      const show = !q || name.includes(q) || appName.includes(q);
      card.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    sec.style.display = (!q || name.includes(q) || visible>0) ? '' : 'none';
  });
}

// ===== PARTICLES =====
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function Particle() {
    this.reset = function() {
      this.x = Math.random()*W;
      this.y = Math.random()*H;
      this.vx = (Math.random()-0.5)*0.5;
      this.vy = (Math.random()-0.5)*0.5;
      this.r = Math.random()*2+0.5;
      this.life = Math.random();
      this.color = Math.random()>0.5?'rgba(0,245,255,':'rgba(255,0,110,';
    };
    this.reset();
  }

  particles = Array.from({length:80},()=>new Particle());

  function draw() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.life += 0.005;
      if(p.x<0||p.x>W||p.y<0||p.y>H||p.life>1) p.reset();
      const alpha = Math.sin(p.life*Math.PI)*0.6;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.color+alpha+')';
      ctx.fill();
    });

    // Draw connections
    particles.forEach((p,i) => {
      particles.slice(i+1).forEach(p2 => {
        const dist = Math.hypot(p.x-p2.x, p.y-p2.y);
        if(dist<120) {
          ctx.beginPath();
          ctx.moveTo(p.x,p.y);
          ctx.lineTo(p2.x,p2.y);
          ctx.strokeStyle = `rgba(0,245,255,${0.1*(1-dist/120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      });
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ===== CURSOR =====
function initCursor() {
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx=0,my=0,rx=0,ry=0;

  document.addEventListener('mousemove', e => {
    mx=e.clientX; my=e.clientY;
    cursor.style.left=mx+'px'; cursor.style.top=my+'px';
  });

  function animRing() {
    rx += (mx-rx)*0.12;
    ry += (my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(animRing);
  }
  animRing();

  document.addEventListener('mousedown', () => {
    cursor.style.transform='translate(-50%,-50%) scale(0.5)';
    ring.style.width='60px'; ring.style.height='60px';
  });
  document.addEventListener('mouseup', () => {
    cursor.style.transform='translate(-50%,-50%) scale(1)';
    ring.style.width='36px'; ring.style.height='36px';
  });
}

// ===== SCROLL =====
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTop');
  btn.classList.toggle('show', window.scrollY>300);
});

// ===== INIT =====
window.addEventListener('DOMContentLoaded', () => {
  initParticles();
  initCursor();
  renderCategories('all');

  // Hide loading
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hide');
  }, 1800);

  // Keyboard
  document.addEventListener('keydown', e => {
    if(e.key==='Escape') closeModal();
  });
});
</script>
